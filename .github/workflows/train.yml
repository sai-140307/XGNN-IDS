name: Train & publish results

# Runs the full experiment (5 GNN variants, 3 baselines, cross-domain, zero-day,
# adversarial and explanation-quality evaluation) and commits the trained models
# and results/ back to the repository so the dashboard can be deployed directly.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick run (smaller data, fewer epochs)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train and evaluate
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then python -m xgnn_ids train --quick; else python -m xgnn_ids train; fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xgnn-ids-results
          path: |
            results/
            models/
      - name: Commit trained models and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models results
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Update trained models and results [skip ci]"
          git pull --rebase origin main
          git push
