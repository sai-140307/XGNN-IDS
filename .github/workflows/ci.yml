name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --durations=10
      - name: CLI smoke test
        run: |
          python -m xgnn_ids generate --profile enterprise --duration 300 --seed 3 --out /tmp/flows.csv
          python -m xgnn_ids train --data /tmp/flows.csv --quick --models egraphsage --baselines rf \
            --no-zero-day --no-adversarial --no-xai --out /tmp/res --models-dir /tmp/models
          python -m xgnn_ids detect /tmp/flows.csv --models-dir /tmp/models --out /tmp/alerts.csv --incidents /tmp/inc.json
          python -m xgnn_ids explain /tmp/flows.csv --models-dir /tmp/models
