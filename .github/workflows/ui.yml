name: UI end-to-end

# Starts the real Streamlit app, drives the console in headless Chromium
# (open an incident, explain a flow, open the report pages) and commits the
# screenshots to docs/screenshots/ for the README.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          PLAYWRIGHT_BROWSERS_PATH=$HOME/pw-browsers python -m playwright install --with-deps chromium
      - name: Drive the console (as root, so live packet capture works)
        run: sudo env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=$HOME/pw-browsers HOME=$HOME "$(which python)" scripts/ui_smoke.py
      - name: Fix file ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" docs/screenshots || true
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update console screenshots [skip ci]"
          git pull --rebase origin main
          git push
